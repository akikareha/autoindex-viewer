<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>DirGallery</title>
  <style>
    :root { --gap: 12px; --tile: 180px; }
    @media (max-width: 600px) {
      :root { --tile: 140px; }
    }
    body { font-family: system-ui, sans-serif; margin: 20px; }
    header { display:flex; align-items:center; gap:10px; flex-wrap: wrap; }
    h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    #crumbs a { color: #0a58ca; text-decoration: none; }
    #crumbs a:hover { text-decoration: underline; }
    #status { color: #666; font-size: .9rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr));
      gap: var(--gap);
    }
    .item { text-align: center; font-size: 0.85rem; }
    .item a { text-decoration: none; color: #333; }
    .thumb { width: var(--tile); height: 140px; display:grid; place-items:center; border: 1px solid #eee; border-radius: 10px; overflow: hidden; background: #fafafa; }
    .thumb img,
    .thumb video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display:block;
    }
    .folder { font-size: 48px; line-height: 1; }
    .name { margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hidden { display:none; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; }
      body { background: #0b0b0c; color: #e6e6e6; }
      #crumbs a { color: #8bb4ff; }
      .item a { color: #dfe3ff; }
      .thumb {
        border-color: #2a2a2e;
        background: #141416;
      }
      #status { color: #9aa0a6; }
    }
    #modal {
      position: fixed;
      inset: 0;
      z-index: 999;
    }
    #modal.hidden { display: none; }
    #modal .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
    }
    #modal .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #modal img,
    #modal video {
      max-width: 90%;
      max-height: 80%;
    }
    #modal .bar {
      display: flex;
      gap: 6px;
      width: 90%;
    }
    #modal input {
      flex: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>DirGallery</h1>
    <div id="crumbs"></div>
    <div id="status" class="hidden"></div>
  </header>

  <div id="grid" class="grid"></div>

  <div id="modal" class="hidden">
    <div class="overlay"></div>
    <div class="content">
      <img id="modal-img" />
      <video id="modal-video" controls class="hidden"></video>
      <div class="bar">
        <input id="modal-url" readonly />
        <button id="copy-btn">Copy</button>
        <button id="open-btn">Open</button>
        <button id="close-btn">✕</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const grid = document.getElementById('grid');
    const crumbs = document.getElementById('crumbs');
    const status = document.getElementById('status');

    function showStatus(msg, isError=false){
      status.textContent = msg || '';
      status.className = msg ? (isError ? '' : '') : 'hidden';
    }

    function normPath(p){
      if (!p) return '/';
      try { p = decodeURIComponent(p); } catch(_){}
      if (!p.startsWith('/')) p = '/' + p;
      if (!p.endsWith('/')) p += '/';
      return p;
    }

    function buildAbsURL(path){
      return new URL(normPath(path), location.origin);
    }

    function setURL(path){
      const qp = new URLSearchParams(location.search);
      qp.set('p', normPath(path));
      history.pushState({p: normPath(path)}, '', location.pathname + '?' + qp.toString());
    }

    function renderCrumbs(path){
      crumbs.innerHTML = '';
      const parts = normPath(path).split('/').filter(Boolean);
      let acc = '/';
      const root = document.createElement('a');
      root.href = '#'; root.textContent = '(root)';
      root.addEventListener('click', (e)=>{ e.preventDefault(); navigate('/'); });
      crumbs.appendChild(root);
      for(const part of parts){
        const sep = document.createTextNode(' / ');
        crumbs.appendChild(sep);
        acc += part + '/';
        const a = document.createElement('a');
        a.href = '#'; a.textContent = part;
        a.addEventListener('click', (e)=>{ e.preventDefault(); navigate(acc); });
        crumbs.appendChild(a);
      }
    }

    function safeDecode(s){
      try {
        return decodeURIComponent(s);
      } catch(_) {
        return s;
      }
    }

    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalVideo = document.getElementById('modal-video');
    const modalURL = document.getElementById('modal-url');

    modalVideo.setAttribute('tabindex', '-1');
    modal.addEventListener('click', ()=>{
      document.body.focus();
    });

    let mediaList = [];
    let currentIndex = -1;

    function stopMedia(){
      modalVideo.pause();
      modalVideo.currentTime = 0;
    }

    function openModal(url, isVideo){
      stopMedia();

      currentIndex = mediaList.findIndex(m => m.url === url);

      if(isVideo){
        modalImg.classList.add('hidden');
        modalVideo.classList.remove('hidden');
        modalVideo.src = url;
        modalVideo.autoplay = true;
      } else {
        modalVideo.classList.add('hidden');
        modalImg.classList.remove('hidden');
        modalImg.src = url;
      }

      modalURL.value = location.origin + url;
      modal.classList.remove('hidden');
    }

    function closeModal(){
      stopMedia();
      modal.classList.add('hidden');
    }

    document.getElementById('close-btn').onclick = closeModal;

    document.getElementById('open-btn').onclick = ()=>{
      const src = modalVideo.classList.contains('hidden')
        ? modalImg.src
        : modalVideo.src;
      window.open(src, '_blank');
    };

    document.getElementById('copy-btn').onclick = ()=>{
      navigator.clipboard.writeText(modalURL.value).catch(()=>{
        prompt("Copy this URL:", modalURL.value);
      });
    };

    modal.addEventListener('click', (e)=>{
      if(e.target.classList.contains('content')){
        closeModal();
      }
    });

    document.addEventListener('keydown', (e)=>{
      if(modal.classList.contains('hidden')) return;

      if(['ArrowLeft','ArrowRight','Escape'].includes(e.key)){
        e.preventDefault();
      }

      if(e.key === 'Escape') closeModal();

      if(e.key === 'ArrowRight'){
        currentIndex = (currentIndex + 1) % mediaList.length;
        openModal(mediaList[currentIndex].url, mediaList[currentIndex].isVideo);
      }

      if(e.key === 'ArrowLeft'){
        currentIndex = (currentIndex - 1 + mediaList.length) % mediaList.length;
        openModal(mediaList[currentIndex].url, mediaList[currentIndex].isVideo);
      }
    });

    let touchStartX = 0;

    modal.addEventListener('touchstart', (e)=>{
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    modal.addEventListener('touchend', (e)=>{
      const touchEndX = e.changedTouches[0].clientX;
      const dx = touchEndX - touchStartX;

      const threshold = 50;

      if(Math.abs(dx) < threshold) return;

      if(dx > 0){
        // right swipe: prev
        currentIndex = (currentIndex - 1 + mediaList.length) % mediaList.length;
      } else {
        // left swipe: next
        currentIndex = (currentIndex + 1) % mediaList.length;
      }

      openModal(mediaList[currentIndex].url, mediaList[currentIndex].isVideo);
    }, { passive: true });

    async function loadDir(path){
      const dirURL = buildAbsURL(path);
      showStatus('Loading ' + dirURL.pathname + ' …');
      grid.innerHTML = '';
      renderCrumbs(dirURL.pathname);

      let res;
      try {
        res = await fetch(dirURL.pathname, { credentials: 'same-origin' });
      } catch(err){
        showStatus('Fetch error: ' + err.message, true);
        return;
      }
      if(!res.ok){
        showStatus('HTTP ' + res.status + ' loading ' + dirURL.pathname, true);
        return;
      }
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const anchors = Array.from(doc.querySelectorAll('a'));

      const IMG_RE = /\.(png|jpe?g|gif|webp|svg)$/i;
      const VIDEO_RE = /\.(mp4|webm)$/i;

      // Nginx autoindex often has Parent Directory as "../"; skip that.
      const items = anchors
        .map(a => a.getAttribute('href'))
        .filter(href => href && href !== '../')
        .map(href => ({
          href,
          isDir: href.endsWith('/'),
          isImg: IMG_RE.test(href),
          isVideo: VIDEO_RE.test(href)
        }));

      // Folders first, then files by name
      items.sort((a,b)=>{
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.href.localeCompare(b.href, undefined, { numeric: true });
      });

      if(items.length === 0){
        showStatus('Empty directory.');
        return;
      }

      mediaList = [];

      for(const it of items){
        // show only folders + image + video files
        if (!it.isDir && !it.isImg && !it.isVideo) continue;
        const full = new URL(it.href, dirURL).pathname; // NOTE: base must be absolute URL
        mediaList.push({
          url: full,
          isVideo: it.isVideo
        });

        const wrap = document.createElement('div');
        wrap.className = 'item';

        const tile = document.createElement('a');
        tile.href = '#';
        tile.className = 'thumb';

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = safeDecode(it.href.replace(/\/$/, ''));

        if(it.isDir){
          const icon = document.createElement('div');
          icon.className = 'folder';
          icon.textContent = '📁';
          tile.appendChild(icon);
          tile.addEventListener('click', (e)=>{ e.preventDefault(); navigate(full); });
        } else if (it.isImg){
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.decoding = 'async';
          img.src = full;
          tile.appendChild(img);
          // click opens original image in modal window
          tile.addEventListener('click', (e)=>{ e.preventDefault(); openModal(full, false); });
        } else if (it.isVideo){
          const video = document.createElement('video');
          video.src = full;
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          video.autoplay = true; // light preview
          video.style.maxWidth = '100%';
          video.style.maxHeight = '100%';
          video.preload = 'metadata';
          tile.appendChild(video);

          tile.addEventListener('click', (e)=>{
            e.preventDefault();
            openModal(full, true);
          });
        }

        wrap.appendChild(tile);
        wrap.appendChild(name);
        grid.appendChild(wrap);
      }

      showStatus('');
    }

    function navigate(path){
      const p = normPath(path);
      setURL(p);
      loadDir(p);
    }

    // Initial path: ?p=/some/dir/ or #/some/dir/ or default to root ("/")
    const sp = new URLSearchParams(location.search);
    let start = sp.get('p') || (location.hash ? location.hash.slice(1) : '/');
    loadDir(normPath(start));

    // Support back/forward buttons
    window.addEventListener('popstate', (e)=>{
      const p = e.state?.p || new URLSearchParams(location.search).get('p') || '/';
      loadDir(normPath(p));
    });
  })();
  </script>
</body>
</html>
